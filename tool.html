<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="2D Artist: a lightweight pixel art and texture editor with layers, editable text, a selection layer, brushes and Minecraft Bedrock texture tools. Runs in your browser, works offline, nothing is uploaded.">
<meta name="theme-color" content="#1b1e27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2D Artist">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>2D Artist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: floating panels around a central canvas stage; tools left, color/options/layers right. */
:root{
  --bg:#12141a; --panel:#1b1e27; --panel-2:#242836; --line:#2f3444;
  --fg:#e7e9f1; --fg-dim:#9aa1b4; --accent:#7f9cff; --accent-ink:#0c1230;
  --accent-soft:rgba(127,156,255,.18); --danger:#ff7b7b; --stage:#2b2e38;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#e6e8ef; --panel:#ffffff; --panel-2:#f1f3f8; --line:#d4d8e4;
    --fg:#1a1d29; --fg-dim:#5f677b; --accent:#3d5ce0; --accent-ink:#ffffff;
    --accent-soft:rgba(61,92,224,.14); --danger:#d23b3b; --stage:#c9cdd8;
    --shadow:0 6px 24px rgba(30,40,70,.18); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e6e8ef; --panel:#ffffff; --panel-2:#f1f3f8; --line:#d4d8e4;
  --fg:#1a1d29; --fg-dim:#5f677b; --accent:#3d5ce0; --accent-ink:#ffffff;
  --accent-soft:rgba(61,92,224,.14); --danger:#d23b3b; --stage:#c9cdd8;
  --shadow:0 6px 24px rgba(30,40,70,.18); color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{
  flex:1;min-height:0;display:grid;gap:8px;padding-block:8px;
  grid-template-columns:48px minmax(0,1fr) 288px;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "tools stage side" "status status status";
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:6px 8px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.06em;margin-right:8px;font-size:14px;color:inherit;text-decoration:none;border-radius:8px;padding:2px 6px 2px 2px}
.brand i{font-style:normal;color:var(--accent)}
.brand .logo{width:28px;height:28px;border-radius:6px;display:block;flex:none}
.brand[href]{cursor:pointer}
.brand[href]:hover{background:var(--panel-2)}
.brand[href]:hover span{text-decoration:underline;text-underline-offset:3px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.grow{flex:1}
.btn{
  background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
  padding:5px 10px;line-height:1.2;white-space:nowrap
}
.btn:hover{border-color:var(--fg-dim)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.sm{padding:3px 7px;font-size:12px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.zoomval{min-width:48px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--fg-dim)}
.menuwrap{position:relative}
.menu{
  position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:210px;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column
}
.menu button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:16px}
.menu button:hover{background:var(--accent-soft)}
.menu kbd{font:11px var(--mono);color:var(--fg-dim)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.tools{grid-area:tools;display:flex;flex-direction:column;gap:2px;padding:6px 4px;overflow-y:auto;align-items:center}
.tool{
  width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:8px;
  background:none;border:1px solid transparent;color:var(--fg-dim)
}
.tool:hover{color:var(--fg);background:var(--panel-2)}
.tool.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tools .tsep{width:24px;height:1px;background:var(--line);margin:4px 0;flex:none}
.stage{
  grid-area:stage;position:relative;background:var(--stage);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;min-width:0;min-height:0
}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#textEditor{
  position:absolute;z-index:5;margin:0;padding:0;border:1px dashed var(--accent);
  background:transparent;resize:none;overflow:hidden;outline:none;white-space:pre;
  transform-origin:0 0;min-width:40px;-webkit-user-select:text;user-select:text
}
.toast{
  position:absolute;left:50%;transform:translateX(-50%);z-index:10;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 12px;
  display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px)
}
.toast{bottom:14px;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.side{grid-area:side;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto}
.sec{padding:10px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sec.layers{flex:none;display:flex;flex-direction:column;padding-bottom:8px}
.sidescroll{flex:none}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.checks label{display:flex;gap:6px;align-items:center;color:var(--fg-dim)}
#sv{width:100%;height:132px;display:block;border-radius:6px;touch-action:none;cursor:crosshair}
#hue{width:100%;height:14px;display:block;border-radius:7px;margin-top:8px;touch-action:none;cursor:ew-resize}
.crow{display:flex;gap:6px;align-items:center;margin-top:8px}
.crow input[type=text]{width:84px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:var(--mono);-webkit-user-select:text;user-select:text}
.cur{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sw{width:18px;height:18px;border-radius:4px;border:1px solid var(--line);padding:0}
.sw:hover{outline:2px solid var(--fg-dim)}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) 38px;gap:6px;align-items:center;margin:6px 0}
.row .lbl{color:var(--fg-dim)}
.row output{font:11px var(--mono);text-align:right;color:var(--fg-dim)}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.slw{display:flex;align-items:center;gap:4px;min-width:0}
.slw input[type=range]{flex:1 1 auto;min-width:0;width:auto}
.stp{flex:none;width:22px;height:22px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);font:600 14px/1 var(--ui);color:var(--fg);touch-action:manipulation}
.stp:hover:not(:disabled){border-color:var(--fg-dim)}
.stp:active:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.stp:disabled{opacity:.4;cursor:default}
select,.field{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.hint{color:var(--fg-dim);font-size:12px;margin:6px 0 0}
.lbtns{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
#layerList{overflow-y:auto;min-height:150px;max-height:240px;display:flex;flex-direction:column;gap:3px;margin-top:4px}
.lrow{display:grid;grid-template-columns:26px 40px minmax(0,1fr);gap:6px;align-items:center;padding:3px;border:1px solid transparent;border-radius:7px;cursor:pointer}
.lrow:hover{background:var(--panel-2)}
.lrow.on{background:var(--accent-soft);border-color:var(--accent)}
.lrow .eye{background:none;border:0;padding:2px;color:var(--fg-dim)}
.lrow .eye.off{opacity:.35}
.lrow canvas{width:40px;height:30px;border-radius:3px;border:1px solid var(--line);display:block}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm small{display:block;color:var(--fg-dim);font-size:11px}
.lrow input{width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.status{grid-area:status;display:flex;gap:14px;padding:5px 10px;font:12px var(--mono);color:var(--fg-dim);flex-wrap:wrap}
.status{min-width:0}
.status span{min-width:0}
.status #stHint{flex:1 1 200px}
.status #stPos,.status #stDoc,.status #stLayer{white-space:nowrap}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.55);display:grid;place-items:center;padding:16px}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;box-sizing:border-box;width:min(458px,100%);max-height:100%;overflow:auto}
.modal h2{margin:0 0 12px;font-size:16px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid2 label,.card label.col{display:flex;flex-direction:column;gap:4px;color:var(--fg-dim)}
.card input[type=number]{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px;-webkit-user-select:text;user-select:text}
.note{color:var(--fg-dim);font-size:12px;margin:8px 0}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.menubar{display:flex;gap:4px;flex-wrap:wrap}
.menu{max-height:70vh;overflow:auto}
.menu button.cur::before{content:"✓ ";color:var(--accent)}
.float{position:absolute;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;max-width:calc(100% - 24px)}
.float h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);display:flex;justify-content:space-between;align-items:center;gap:10px}
.float canvas{display:block;max-width:100%;image-rendering:pixelated;border-radius:4px;background:var(--panel-2)}
#tilePanel{right:12px;top:12px}
#animPanel{left:12px;bottom:12px}
.film{display:flex;gap:4px;overflow-x:auto;margin-top:6px;max-width:320px}
.film canvas{flex:none;height:44px;width:auto;border:1px solid var(--line);cursor:pointer}
.film canvas.on{border-color:var(--accent);outline:1px solid var(--accent)}
.dlgrows{display:grid;gap:6px;margin:8px 0}
.dlgrows .row{grid-template-columns:96px minmax(0,1fr) 46px}
.card.wide{width:min(558px,100%)}
.pal{position:fixed;inset:0;z-index:60;background:rgba(5,8,16,.5);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(480px,100%);padding:8px;display:flex;flex-direction:column;gap:6px}
.pal input{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;-webkit-user-select:text;user-select:text}
.pal .list{max-height:50vh;overflow:auto;display:flex;flex-direction:column}
.pal .list button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:12px}
.pal .list button.on,.pal .list button:hover{background:var(--accent-soft)}
.chk{display:flex;gap:8px;margin:7px 0;align-items:flex-start}
.chk b{flex:none;width:18px;text-align:center}
.chk.ok b{color:var(--accent)}
.chk.warn b{color:var(--danger)}
.chk.info b{color:var(--fg-dim)}
.card.xwide{width:min(698px,100%)}
.split{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.split .ctl{flex:1 1 240px;min-width:0}
.mini{flex:0 0 190px;width:190px;max-width:100%;position:sticky;top:0}
.mini canvas{display:block;width:100%;height:auto;max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);touch-action:none;cursor:pointer}
.mini small{display:block;color:var(--fg-dim);font-size:11px;margin-top:5px}
.lrow.sellayer{border:1px dashed var(--line);margin-bottom:4px}
.lrow.sellayer.on{border-color:#ff2d6f;background:rgba(255,45,111,.14)}
.selbanner{border:1px solid #ff2d6f;background:rgba(255,45,111,.10);border-radius:8px;padding:6px 8px;margin:0 0 8px}
.selbanner .hint{margin:2px 0 6px}
.fontsel{width:100%;margin:2px 0 6px;box-sizing:border-box}
.only-narrow{display:none}
@media (max-width:560px){
  .mini{order:-1;flex:1 1 100%;width:100%;background:var(--panel);z-index:2;padding-bottom:4px}
  .mini canvas{max-height:130px}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
       grid-template-areas:"top" "stage" "tools" "status"}
  .tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;padding:4px 6px}
  .tools .tsep{width:1px;height:24px;margin:0 4px}
  .side{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right,0px));top:12px;bottom:12px;width:min(300px,calc(100% - 32px));display:none;box-shadow:var(--shadow)}
  .side.open{display:flex}
  .only-narrow{display:inline-block}
  .brand{margin-right:2px}
}

/* gallery (home screen) */
:root{--chk:rgba(128,138,165,.2)}
.gallery{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.ghead .logo{width:32px;height:32px;border-radius:7px;display:block;flex:none}
.ghead h1{margin:0;font-size:18px;font-weight:700}
.gcount{color:var(--fg-dim);font-size:12px}
.gsearch{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-width:0;flex:0 1 220px;-webkit-user-select:text;user-select:text}
.gfield{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.gscroll{flex:1;min-height:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;max-width:1600px;margin:0 auto}
.gcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.gcard:hover,.gcard:focus-within{border-color:var(--fg-dim)}
.gcard.menuopen{z-index:6}
.gopen{background:none;border:0;border-radius:12px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:left;width:100%;min-width:0}
.gthumb{display:grid;place-items:center;height:132px;border-radius:7px;overflow:hidden;background-color:var(--panel-2);
  background-image:linear-gradient(45deg,var(--chk) 25%,transparent 25%,transparent 75%,var(--chk) 75%),linear-gradient(45deg,var(--chk) 25%,transparent 25%,transparent 75%,var(--chk) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
.gthumb img{width:100%;height:100%;object-fit:contain;display:block}
.gthumb.pix img{image-rendering:pixelated}
.gnone{color:var(--fg-dim);font-size:12px}
.gname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.gopen small{color:var(--fg-dim);font-size:11px;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmore{position:absolute;top:13px;right:13px;width:28px;height:28px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px;line-height:1}
.gmore:hover{border-color:var(--fg-dim)}
.gmenu{position:absolute;right:8px;top:46px;z-index:7;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column}
.gmenu button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px}
.gmenu button:hover,.gmenu button:focus-visible{background:var(--accent-soft)}
.gmenu .danger{color:var(--danger)}
.gnew{background:none;border:2px dashed var(--line);border-radius:12px;min-height:188px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--fg-dim);font-weight:600}
.gnew:hover{border-color:var(--accent);color:var(--accent)}
.gplus{font-size:38px;line-height:1;font-weight:400}
.gempty{max-width:520px;margin:22px auto 0;text-align:center;color:var(--fg-dim);font-size:13px;line-height:1.5}
.gfoot{display:flex;gap:4px 12px;align-items:center;flex-wrap:wrap;background:var(--panel);border-top:1px solid var(--line);color:var(--fg-dim);font-size:12px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gfoot .bad{color:var(--danger)}
.gallery .toast{bottom:88px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--bg)}
.status #stSave{white-space:nowrap}
.status #stSave.bad{color:var(--danger)}
.modal .card p:not(.note){margin:6px 0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>

    <div class="menuwrap">
      <button class="btn" id="fileBtn" aria-haspopup="true">File</button>
      <div class="menu" id="fileMenu" hidden>
        <button data-act="new">New canvas…</button>
        <button data-act="open">Open drawing or image…</button>
        <button data-act="import">Import image as layer…</button>
        <hr>
        <button data-act="saveproj">Save drawing (.json) <kbd>Ctrl+S</kbd></button>
        <button data-act="png">Export PNG</button>
        <button data-act="jpg">Export JPG</button>
      </div>
    </div>
    <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <span class="sep"></span>
    <button class="btn sm" id="zoomOut" title="Zoom out (-)">−</button>
    <span class="zoomval" id="zoomVal">100%</span>
    <button class="btn sm" id="zoomIn" title="Zoom in (+)">+</button>
    <button class="btn sm" id="fitBtn" title="Fit to screen (Ctrl+0)">Fit</button>
    <button class="btn sm" id="rotL" title="Rotate view left">↺</button>
    <button class="btn sm" id="rotR" title="Rotate view right">↻</button>
    <button class="btn sm" id="flipV" title="Flip view (F)">Flip</button>
    <span class="grow"></span>
    <button class="btn only-narrow" id="panelBtn">Panels</button>
  </header>
  <nav class="tools panel" id="tools" aria-label="Tools"></nav>
  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <textarea id="textEditor" hidden spellcheck="false"></textarea>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <aside class="side panel" id="side">
    <div class="sidescroll">
      <section class="sec">
        <h3>Color</h3>
        <canvas id="sv" width="260" height="132"></canvas>
        <canvas id="hue" width="260" height="14"></canvas>
        <div class="crow"><div class="cur" id="curColor"></div><input type="text" id="hexIn" maxlength="7" aria-label="Hex color"><span class="grow"></span></div>
        <div class="chips" id="palChips" style="margin-top:8px"></div>
        <div class="swatches" id="swatches" style="margin-top:0"></div>
        <div class="swatches" id="recent" aria-label="Recent colors"></div>
      </section>
      <section class="sec"><h3 id="optTitle">Brush</h3><div id="options"></div></section>
    </div>
    <section class="sec layers">
      <h3>Layers <span id="layerCount"></span></h3>
      <div class="lbtns">
        <button class="btn sm" data-lact="add" title="New layer">+ Add</button>
        <button class="btn sm" data-lact="dup" title="Duplicate this layer (Ctrl+D)">Duplicate</button>
        <button class="btn sm" data-lact="copy" title="Copy the selection, or the whole layer, to the clipboard (Ctrl+C)">Copy</button>
        <button class="btn sm" data-lact="paste" title="Paste the image on the clipboard as a new layer (Ctrl+V)">Paste</button>
        <button class="btn sm" data-lact="del">Delete</button>
        <button class="btn sm" data-lact="merge">Merge ↓</button>
        <button class="btn sm" data-lact="up" title="Move up">↑</button>
        <button class="btn sm" data-lact="down" title="Move down">↓</button>
        <button class="btn sm" data-lact="clear">Clear</button>
        <button class="btn sm" data-lact="fliph" title="Flip layer horizontally">⇆</button>
        <button class="btn sm" data-lact="flipv" title="Flip layer vertically">⇅</button>
      </div>
      <div class="row"><span class="lbl">Opacity</span><input type="range" id="lOpacity" min="0" max="100" value="100" aria-label="Layer opacity"><output id="lOpacityOut">100%</output></div>
      <div class="row"><span class="lbl">Blend</span><select id="lBlend" style="grid-column:2 / 4"></select></div>
      <div class="checks">
        <label title="Paint only where the layer already has pixels"><input type="checkbox" id="lLock"> Alpha lock</label>
        <label title="Prevent any edits to this layer"><input type="checkbox" id="lFull"> Lock layer</label>
      </div>
      <div id="layerList"></div>
    </section>
  </aside>
  <footer class="status panel" id="status">
    <span id="stHint">Ready</span><span id="stPos"></span><span id="stDoc"></span><span id="stLayer"></span><span id="stSave"></span>
  </footer>
</div>
<div class="gallery" id="gallery" hidden role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <header class="ghead">
    <img class="logo" id="gLogo" alt="" width="32" height="32">
    <h1 id="gTitle">My drawings</h1><span class="gcount" id="gCount"></span>
    <span class="grow"></span>
    <input class="gsearch" id="gSearch" type="search" placeholder="Search drawings" aria-label="Search drawings" autocomplete="off">
    <select id="gSort" aria-label="Sort drawings"><option value="edited">Recently edited</option><option value="created">Newest first</option><option value="name">Name A to Z</option></select>
    <button class="btn" id="gOpenFile" title="Open a .json drawing or a picture from your computer">Open file…</button>
    <button class="btn" id="gHome" hidden title="Back to the 2D Artist home page">Home page</button>
    <button class="btn" id="gBack" hidden>Back to drawing</button>
    <button class="btn primary" id="gNew">+ New canvas</button>
  </header>
  <div class="gscroll">
    <div class="ggrid" id="gGrid"></div>
    <p class="gempty" id="gEmpty" hidden></p>
  </div>
  <footer class="gfoot"><span id="gNote"></span><span id="gNote2"></span><button class="btn sm" id="gFolder" hidden>Show folder</button></footer>
  <div class="toast" id="gtoast" role="status"></div>
</div>
<div class="modal" id="newDlg" hidden role="dialog" aria-modal="true" aria-labelledby="newTitle">
  <div class="card">
    <h2 id="newTitle">New canvas</h2>
    <div class="presets" id="presets"></div>
    <div class="grid2">
      <label>Width (px)<input id="newW" type="number" min="16" max="4096" value="1600"></label>
      <label>Height (px)<input id="newH" type="number" min="16" max="4096" value="1200"></label>
    </div>
    <label class="col" style="margin-bottom:10px">Name<input id="newName" class="gfield" type="text" maxlength="80" value="Untitled"></label>
    <label class="col">Background
      <select id="newBg"><option value="white">White paper</option><option value="none">Transparent</option></select>
    </label>
    <p class="note">The new drawing is added to your gallery and saved automatically. The drawing you have open now stays in the gallery too. Largest size is 4096 px per side.</p>
    <div class="actions"><button class="btn" id="newCancel">Cancel</button><button class="btn primary" id="newOk">Create</button></div>
  </div>
</div>

<script>

const doc = { w: 1600, h: 1200, layers: [], active: null };
const aux = {};
let seq = 0, live = null, sel = null, compDirty = true, compVer = 0, selVer = 0;
const BLENDS = [['Normal','source-over'],['Multiply','multiply'],['Screen','screen'],['Overlay','overlay'],['Darken','darken'],['Lighten','lighten'],['Color dodge','color-dodge'],['Color burn','color-burn'],['Hard light','hard-light'],['Soft light','soft-light'],['Difference','difference'],['Exclusion','exclusion'],['Hue','hue'],['Saturation','saturation'],['Color','color'],['Luminosity','luminosity'],['Add','lighter']];

/* ---------- history ---------- */

/* ---------- layer operations ---------- */

    undo() { const i = doc.layers.indexOf(L); if (i >= 0) doc.layers.splice(i, 1); doc.active = prev; },
    redo() { doc.layers.splice(idx, 0, L); doc.active = L; }

    undo() { B.ctx.putImageData(before, 0, 0); B.text = bText; doc.layers.splice(idx, 0, L); doc.active = L; },
    redo() { B.ctx.putImageData(after, 0, 0); B.text = null; const i = doc.layers.indexOf(L); if (i >= 0) doc.layers.splice(i, 1); doc.active = B; }

  if (recent[0] === color.hex) return;

  recent.unshift(color.hex); if (recent.length > 14) recent.pop();

/* ---------- text layers become pixels when painted on ---------- */

  if (!L || !L.text) return;
  const t = L.text; L.text = null;
  push({ undo() { L.text = t; renderTextLayer(L); }, redo() { L.text = null; } });
  toast('The text became pixels. Undo brings the editable text back.');
}

/* ---------- view, compositing, rendering ---------- */

    t.drawImage(live.fl, live.region.x + live.dx, live.region.y + live.dy);

    const o = JSON.parse(json), now = Date.now(), id = newId(), name = (m.name + ' copy').slice(0, 80);

async function saveCopyOfDrawing(m) {

    const o = JSON.parse(json); o.name = m.name;

function deleteDrawing(m) {

    el('p', { text: '“' + m.name + '” (' + m.w + '×' + m.h + ') will be deleted from this device' + (native ? ' and moved to the Recycle Bin.' : '. This cannot be undone.') }),

async function doDelete(m) {

/* drawings made with an older version of the Windows app lived in the browser database: copy them into the new project folder once */
async function migrateLegacy() {
  if (!GStore.native) return;
  try { if (localStorage.getItem('2da-fs-migrated')) return; } catch (err) { /* then it simply runs again; it never copies a drawing twice */ }
  try {
    const metas = await idbTx(['meta'], 'readonly', (m) => m.getAll());
    if (metas.length) {
      const have = new Set((await GStore.list()).map((x) => x.id));
      for (const m of metas) {
        if (have.has(m.id)) continue;
        const r = await idbTx(['docs'], 'readonly', (d) => d.get(m.id));
        if (r && typeof r.json === 'string') await window.nativeApp.galleryPut(normMeta(m), r.json);
      }
    }
    try { localStorage.setItem('2da-fs-migrated', '1'); } catch (err) { /* optional */ }
  } catch (err) { /* tried again at the next start */ }
}
async function startGallery() {
  if (window.__NO_GALLERY) return;
  try { await Promise.race([migrateLegacy(), new Promise((r) => setTimeout(r, 4000))]); } catch (err) { /* never blocks the gallery */ }
  openGallery();
}

function closeMenus() { $$('.menu').forEach((m) => { m.hidden = true; }); }

function buildMenus() {
  const bar = el('nav', { class: 'menubar', 'aria-label': 'Menus' });
  for (const name of [...new Set(CMDS.map((c) => c[0]))]) {
    const wrap = el('div', { class: 'menuwrap' }), menu = el('div', { class: 'menu', hidden: true }), btn = el('button', { class: 'btn', text: name, 'aria-haspopup': 'true' });
    btn.addEventListener('click', () => {

      menu.replaceChildren(...CMDS.filter((c) => c[0] === name).map((c) => el('button', { class: c[4] && c[4]() ? 'cur' : '', onclick: () => { closeMenus(); c[3](); } }, c[1], c[2] ? el('kbd', { text: c[2] }) : null)));
      menu.hidden = false;
    });

function openPalette() {
  if ($('.pal')) return;
  const all = [...TOOLS.filter((t) => t !== '-').map((t) => ['Tool', t[1], t[2], () => setTool(t[0])]), ...CMDS];
  const inp = el('input', { placeholder: 'Search tools and commands…', 'aria-label': 'Search commands' }), list = el('div', { class: 'list' });
  const m = el('div', { class: 'pal' }, el('div', { class: 'card' }, inp, list));
  let idx = 0, shown = [];
  const close = () => { m.remove(); };
  const draw = () => {
    const q = inp.value.toLowerCase().split(/\s+/).filter(Boolean);
    shown = all.filter((c) => q.every((w) => (c[0] + ' ' + c[1]).toLowerCase().includes(w))).slice(0, 40); idx = Math.min(idx, Math.max(0, shown.length - 1));
    list.replaceChildren(...shown.map((c, i) => el('button', { class: i === idx ? 'on' : '', onclick: () => { close(); c[3](); } }, el('span', { text: c[0] + ': ' + c[1] }), el('kbd', { text: c[2] || '', style: 'font:11px var(--mono);color:var(--fg-dim)' }))));
    if (!shown.length) list.append(el('p', { class: 'note', text: 'No matches' }));
  };
  inp.addEventListener('input', () => { idx = 0; draw(); });
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowDown') { idx = Math.min(shown.length - 1, idx + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { idx = Math.max(0, idx - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter' && shown[idx]) { const f = shown[idx][3]; close(); f(); }
  });
  m.addEventListener('pointerdown', (e) => { if (e.target === m) close(); });
  document.body.append(m); draw(); inp.focus();
}

/* ---------- keyboard ---------- */
const TOOL_KEYS = { b: 'brush', e: 'eraser', s: 'smudge', g: 'fill', d: 'gradient', i: 'picker', l: 'line', r: 'rect', o: 'ellipse', t: 'text', m: 'select', v: 'move', h: 'hand' };
document.addEventListener('keydown', (e) => {
  const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if (dialogOpen() || typing && !(e.ctrlKey || e.metaKey)) return;
  if (typing) return;
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;
  if (ctrl) {
    const lk = k.toLowerCase(); let used = true;
    if (lk === 'z') (e.shiftKey ? redo : undo)(); else if (lk === 'y') redo();
    else if (lk === 's') (e.shiftKey ? saveAs : saveCurrent)(); else if (lk === 'i') invertSel(); else if (lk === 'o') openPicker(); else if (lk === 'e') openExport();
    else if (lk === 'a') selAll(); else if (lk === 'd') duplicateLayer(); else if (lk === 'c') copySel(); else if (lk === 'x') cutSel();
    else if (lk === 'k') openPalette(); else if (k === '0') fitView(); else if (k === '1') zoom100();
    else used = false;
    if (used) e.preventDefault();
    return;
  }
  if (k === ' ') { e.preventDefault(); if (!spaceDown) { spaceDown = true; updateCursor(); } return; }
  if (k === 'Escape') { if (sel) { selNone(); renderOptions(); } return; }
  if (k === 'Delete' || k === 'Backspace') { if (doc.active && doc.active.isSel) selNone(); else clearSel(); e.preventDefault(); return; }
  if (k === '[' || k === ']') {
    const s = settings[tool] || (['line', 'rect', 'ellipse'].includes(tool) ? settings.shape : null);
    if (s && s.size) { s.size = clamp(Math.round(s.size + (k === ']' ? 1 : -1) * Math.max(1, s.size * 0.1)), 1, 300); renderOptions(); requestRender(); }
    return;
  }
  if (k === '+' || k === '=') { zoomAt(1.25, stage.clientWidth / 2, stage.clientHeight / 2); return; }
  if (k === '-') { zoomAt(0.8, stage.clientWidth / 2, stage.clientHeight / 2); return; }
  if (TOOL_KEYS[k.toLowerCase()]) setTool(TOOL_KEYS[k.toLowerCase()]);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Shift' && !hover.shift) { hover.shift = true; if (hover.in && linePoint()) requestRender(); } });
document.addEventListener('keyup', (e) => {
  if (e.key === ' ' && spaceDown) { spaceDown = false; updateCursor(); }
  if (e.key === 'Shift' && hover.shift) { hover.shift = false; requestRender(); }
});
window.addEventListener('blur', () => { spaceDown = false; hover.shift = false; updateCursor(); });
